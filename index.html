<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大阪・神戶七日行</title>

<meta name="mobile-web-app-capable" content="yes">

<style>
/* 和紙 + 藍染 + 朱 — a Japanese stationery feel. Mincho serif for headings and times, sans for body.
   Indigo carries structure (lines, chips), vermilion marks only the important: stamps, warnings, the current day. */
:root{
  color-scheme: light;
  --paper:#f3ede1; --paper2:#faf6ee; --sumi:#2a2622; --sumi2:#6d645a; --sumi3:#9d9488; --rule:#ddd2bf;
  --ai:#24406b; --ai2:#3d5d8c; --ai-bg:#e3e8ef; --shu:#b8402f; --shu-bg:#f6e3dc; --kin:#a8834a;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mincho:"Shippori Mincho","Noto Serif TC","PingFang TC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper)}
body{margin:0;color:var(--sumi);font-family:var(--sans);font-size:15px;line-height:1.7;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(rgba(120,100,70,.05) 1px,transparent 1px);background-size:5px 5px}
button,input{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(250,246,238,.96);border-top:1px solid var(--rule);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nb{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--sumi3);padding:4px 0;cursor:pointer}
.nb svg{width:23px;height:23px}
.nb[aria-current="page"]{color:var(--ai);font-weight:700}
.nb[aria-current="page"] svg{color:var(--shu)}

/* headings */
.ttl{font-family:var(--mincho);font-weight:800;font-size:27px;margin:22px 18px 2px;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.ttl::before{content:"";width:6px;height:24px;background:var(--shu);border-radius:1px}
.lead{color:var(--sumi2);font-size:13.5px;margin:2px 18px 6px}
.sec{font-family:var(--mincho);font-weight:700;font-size:19px;margin:24px 18px 8px;padding-bottom:6px;border-bottom:1px solid var(--rule);letter-spacing:.04em}

/* paper card */
.card{background:var(--paper2);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;margin:12px 18px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card h3{font-family:var(--mincho);font-weight:700;font-size:17px;margin:0 0 8px;letter-spacing:.03em}
.card.ai{border-left:4px solid var(--ai)}
.card.shu{border-left:4px solid var(--shu);background:#fbf1ec}
.small{font-size:13px;color:var(--sumi2)}
.muted{color:var(--sumi2)}
ul.li,ol.li{margin:0;padding-left:20px}
ul.li li,ol.li li{margin:5px 0;font-size:14.5px}
ol.li li::marker{font-family:var(--mincho);color:var(--ai);font-weight:700}
b.shu,.shu-t{color:var(--shu)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ai);border-radius:4px;background:transparent;color:var(--ai);padding:5px 12px;font-size:13.5px;font-weight:500;text-decoration:none;cursor:pointer;margin-top:8px}
.btn.solid{background:var(--ai);color:#fff}
.btn.shu{border-color:var(--shu);color:var(--shu)}
.btn svg{width:15px;height:15px}
.chip{display:inline-block;border:1px solid var(--ai2);color:var(--ai);border-radius:3px;font-size:11.5px;padding:0 6px;margin-left:6px;vertical-align:2px;line-height:1.6}
.chip.shu{border-color:var(--shu);color:var(--shu)}

/* hero */
.hero{position:relative;background:var(--paper2);border-bottom:1px solid var(--rule)}
.hero svg{display:block;width:100%;height:auto}
.vt{position:absolute;top:16px;right:16px;display:flex;flex-direction:row-reverse;align-items:flex-start;gap:10px;color:var(--sumi)}
.vt .col{display:flex;flex-direction:column;align-items:center;font-family:var(--mincho);font-weight:800;font-size:30px;line-height:1.08}
.vt .col.s{font-size:13px;font-weight:700;color:var(--sumi2);line-height:1.35;margin-top:16px}
.hanko{position:absolute;top:20px;left:18px;width:52px;height:52px;border:2.5px solid var(--shu);border-radius:6px;color:var(--shu);font-family:var(--mincho);font-weight:800;font-size:15px;line-height:1.05;display:grid;place-items:center;text-align:center;transform:rotate(-6deg);background:rgba(250,246,238,.7)}
.hero-info{padding:14px 18px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.en{font-family:var(--mincho);letter-spacing:.32em;font-size:12px;color:var(--sumi2)}
.dates{font-family:var(--mincho);font-weight:700;font-size:18px;letter-spacing:.08em}
.cd{display:flex;gap:6px;align-items:flex-end}
.cd .u{border:1px solid var(--rule);background:var(--paper);border-radius:4px;min-width:50px;text-align:center;padding:4px 6px}
.cd .u b{display:block;font-family:var(--mincho);font-size:24px;font-weight:800;line-height:1.1;color:var(--ai)}
.cd .u span{font-size:11px;color:var(--sumi2)}
.cd .lb{font-size:12px;color:var(--sumi2);align-self:center;margin-right:2px}

.fl{display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:6px;padding:10px 0}
.fl+.fl{border-top:1px dashed var(--rule)}
.fl .no{font-family:var(--mincho);font-weight:700;font-size:14px;color:#fff;background:var(--ai);border-radius:3px;padding:2px 6px;margin-right:4px}
.fl .pt{font-size:12.5px;color:var(--sumi2);text-align:center}
.fl .pt b{display:block;font-family:var(--mincho);font-size:22px;color:var(--sumi);font-weight:700}
.fl .ar{color:var(--shu);font-size:18px}

.dl{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;text-decoration:none;padding:10px 0;border-top:1px solid var(--rule)}
.dl:first-of-type{border-top:0}
.dl .k{font-family:var(--mincho);font-weight:800;color:var(--ai);font-size:15px;text-align:center;border:1px solid var(--ai);border-radius:3px;padding:2px 0;line-height:1.3}
.dl .k small{display:block;font-size:11px;color:var(--sumi2);font-weight:500}
.dl b{font-weight:500;font-size:15px;display:block}
.dl span{font-size:12.5px;color:var(--sumi2)}
.dl i{font-style:normal;color:var(--sumi3)}
.dl.today .k{background:var(--shu);border-color:var(--shu);color:#fff}
.dl.today .k small{color:#fff}

/* day */
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 18px 4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
.days::-webkit-scrollbar{display:none}
.dp{flex:0 0 auto;border:1px solid var(--rule);background:var(--paper2);border-radius:4px;padding:4px 12px;cursor:pointer;text-align:center;font-family:var(--mincho);font-weight:700;font-size:14px;color:var(--sumi)}
.dp small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--sumi2)}
.dp[aria-selected="true"]{background:var(--ai);border-color:var(--ai);color:#fff}
.dp[aria-selected="true"] small{color:#dfe6f0}
.dhead{margin:16px 18px 0;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.dhead .stamp{width:64px;height:64px;border:2.5px solid var(--shu);border-radius:50%;color:var(--shu);display:grid;place-items:center;text-align:center;font-family:var(--mincho);font-weight:800;line-height:1.05;transform:rotate(-8deg)}
.dhead .stamp b{font-size:24px;display:block}
.dhead .stamp small{font-size:10.5px;letter-spacing:.1em}
.dhead h1{font-family:var(--mincho);font-weight:800;font-size:22px;margin:0;line-height:1.35;letter-spacing:.03em}
.dhead p{margin:2px 0 0;font-size:13px;color:var(--sumi2)}

.tl{list-style:none;margin:14px 18px 0;padding:0}
.tl li{display:grid;grid-template-columns:54px 1fr;gap:12px;position:relative;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:66px;top:12px;bottom:0;width:1px;background:var(--ai2);opacity:.45}
.tl li:last-child::before{display:none}
.tl .t{font-family:var(--mincho);font-weight:700;font-size:16px;color:var(--ai);text-align:right;padding-top:1px}
.tl .b{position:relative;padding-left:14px}
.tl .b::before{content:"";position:absolute;left:-5px;top:9px;width:9px;height:9px;background:var(--paper);border:1.5px solid var(--ai);transform:rotate(45deg)}
.tl li.mv .b::before{border-color:var(--sumi3)}
.tl li.mv .n{color:var(--sumi2);font-weight:500}
.tl .n{font-weight:700;font-size:15.5px;line-height:1.5}
.tl .d{font-size:13.5px;color:var(--sumi2);margin-top:2px}

.how{counter-reset:s;list-style:none;margin:0;padding:0}
.how li{counter-increment:s;position:relative;padding:6px 0 6px 34px;font-size:14.5px;border-top:1px dashed var(--rule)}
.how li:first-child{border-top:0}
.how li::before{content:counter(s);position:absolute;left:0;top:8px;width:22px;height:22px;border-radius:50%;background:var(--ai);color:#fff;font-family:var(--mincho);font-weight:700;font-size:12.5px;display:grid;place-items:center}

/* tools sub-nav */
.sub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 18px 0}
.sub::-webkit-scrollbar{display:none}
.sub a{flex:0 0 auto;text-decoration:none;border:1px solid var(--rule);background:var(--paper2);border-radius:4px;padding:5px 14px;font-size:14px;color:var(--sumi2)}
.sub a[aria-current="page"]{border-color:var(--ai);color:var(--ai);font-weight:700;background:var(--ai-bg)}

/* guide */
details.g{background:var(--paper2);border:1px solid var(--rule);border-radius:6px;margin:10px 18px}
details.g summary{list-style:none;cursor:pointer;padding:13px 16px;font-family:var(--mincho);font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:10px}
details.g summary::-webkit-details-marker{display:none}
details.g summary .no{font-size:12px;color:#fff;background:var(--ai);border-radius:3px;padding:0 6px;font-family:var(--sans)}
details.g summary::after{content:"＋";margin-left:auto;color:var(--sumi3);font-family:var(--sans)}
details.g[open] summary::after{content:"－"}
details.g .gb{padding:0 16px 14px}
.warn{background:var(--shu-bg);border-left:3px solid var(--shu);padding:8px 12px;margin:8px 0;font-size:14px;border-radius:0 4px 4px 0}
.jp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px dashed var(--rule)}
.jp:first-child{border-top:0}
.jp b{font-family:var(--mincho);font-size:17px;font-weight:700}
.jp span{font-size:12.5px;color:var(--sumi2);grid-column:1}
.jp em{font-style:normal;font-size:13.5px;grid-column:2;grid-row:1/3;align-self:center;text-align:right}

/* tables, forms */
table{border-collapse:collapse;width:100%;font-size:14.5px}
td,th{text-align:left;padding:7px 2px;border-top:1px solid var(--rule)}
th{font-weight:500;color:var(--sumi2);font-size:13px;border-top:0}
td.r,th.r{text-align:right;font-family:var(--mincho);font-weight:700;white-space:nowrap}
.est td:first-child{white-space:nowrap}
td.muted{white-space:nowrap;width:3.4em;vertical-align:top}
tr.sum td{font-weight:700;border-top:1.5px solid var(--sumi)}
.ck{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px dashed var(--rule)}
.ck:first-of-type{border-top:0}
.ck input[type=checkbox]{width:20px;height:20px;accent-color:#24406b;flex:0 0 auto}
.ck label{flex:1;font-size:15px}
.ck.on label{color:var(--sumi3);text-decoration:line-through}
.del{border:1px solid var(--rule);background:transparent;border-radius:3px;font-size:12px;padding:2px 10px;color:var(--sumi2);cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.addrow input{flex:1;min-width:0;border:1px solid var(--rule);background:#fff;border-radius:4px;padding:7px 10px;font-size:14.5px}
.addrow button{border:0;background:var(--ai);color:#fff;border-radius:4px;padding:7px 14px;cursor:pointer}
.wrow{display:grid;grid-template-columns:48px 70px 1fr;gap:6px;padding:8px 0;border-top:1px dashed var(--rule);font-size:14px}
.wrow:first-of-type{border-top:0}
.wrow .dt{font-family:var(--mincho);font-weight:700}
.near{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 18px}
.near a{display:block;text-align:center;background:var(--paper2);border:1px solid var(--ai2);color:var(--ai);border-radius:4px;padding:12px 4px;text-decoration:none;font-size:14.5px}
.near a small{display:block;font-size:11px;color:var(--sumi3);font-family:var(--mincho)}
.foot{color:var(--sumi3);font-size:12px;text-align:center;margin:22px 18px 0}

@keyframes snow{from{transform:translateY(-10px)}to{transform:translateY(300px)}}
.flake{animation:snow linear infinite}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(460px)}}
.cloud{animation:drift 40s linear infinite}
@media (prefers-reduced-motion:reduce){.flake,.cloud{animation:none}}
</style>
</head>

const GUIDE=[
 {t:"出發前 2 週要做的事",b:`<ol class="li">
  <li><b>護照</b>：確認效期涵蓋整趟旅程（建議還有 6 個月以上）。台灣護照去日本 90 天內免簽。</li>
  <li><b>Visit Japan Web</b>：上官網 vjw.digital.go.jp 註冊，填護照、航班（JX360）、住宿（Comic&Books 地址），兩個人要分別登錄或用「同行家人」。完成後會拿到<b>一個 QR Code</b>，入境審查和海關都用它。截圖存起來。</li>
  <li><b>網路</b>：買日本 eSIM 或 Wi-Fi 機，出發前裝好，落地再開。</li>
  <li><b>西瓜卡</b>：iPhone 錢包裡的 Suica 先用 Apple Pay 儲值 ¥3,000–5,000 試試看。</li>
  <li><b>錢</b>：每人換 ¥30,000–40,000 現金；信用卡打電話或用 App 開好海外刷卡。</li>
  <li><b>保險</b>：旅平險＋旅遊不便險（班機延誤、行李遺失）。</li>
  <li><b>訂位</b>：神戶牛鐵板燒（1/14 傍晚）先訂好。</li>
  <li><b>App</b>：Google Maps、Google 翻譯（下載日文離線包）、航空公司 App。</li></ol>`},
 {t:"打包規定",b:`<ul class="li">
  <li><b>行動電源、鋰電池只能放隨身行李</b>，不能託運。</li>
  <li>隨身行李的液體每瓶 100ml 以下，裝進一個透明夾鏈袋。超過的放託運。</li>
  <li>刀、剪刀放託運。</li>
  <li>日本插座跟台灣一樣（A 型、100V），手機、筆電充電器可以直接用。</li>
  <li><b class="shu">肉製品不能帶進日本</b>（肉乾、香腸、肉鬆、含肉泡麵），水果也不行。</li>
  <li>自己吃的常備藥可以帶，放原包裝。</li>
  <li>託運行李重量看電子機票上寫的額度，回程會多買東西，去程留空間。</li></ul>`},
 {t:"出境：高雄小港機場",b:`<ol class="li">
  <li>起飛前 <b>2.5 小時</b>到國際線航廈（08:25 起飛 → 06:00 前到）。</li>
  <li>星宇櫃台報到：給護照，託運大行李，拿登機證。</li>
  <li>安檢：外套、筆電、行動電源、液體袋拿出來放籃子。</li>
  <li>出境證照查驗：排隊給護照。想更快可以先在機場臨櫃註冊「自動通關」。</li>
  <li>看登機證上的<b>登機門和登機時間</b>，提早 30 分鐘到登機門。</li></ol>`},
 {t:"入境：神戶機場（第 2 航廈）",b:`<ol class="li">
  <li>下飛機跟著「Arrivals／入国審査」走。</li>
  <li><b>入境審查</b>：排「外國人」隊伍，給護照＋Visit Japan Web QR Code，機器拍照、按兩隻食指指紋。護照會貼一張上陸許可貼紙，不要撕。</li>
  <li><b>領行李</b>：看螢幕上 JX360 的轉盤號碼。</li>
  <li><b>海關</b>：出示同一個 QR Code，沒有要申報的就直接走。</li>
  <li>出來後走約 3 分鐘到第 1 航廈 2 樓搭 Port Liner（也有免費接駁車）。</li></ol>
  <div class="warn">沒填 Visit Japan Web 也能入境，但要在現場填紙本表格，會花比較久。</div>`},
 {t:"搭電車（最重要）",b:`<ul class="li">
  <li><b>進站、出站都要刷西瓜卡</b>，刷卡處在閘門右手邊。</li>
  <li>大阪的電車分很多家公司：JR、地鐵、阪神、阪急、近鐵、京阪。<b>不同公司的車站是分開的</b>，轉乘要出站走一段，跟著指標找公司名字。</li>
  <li>月台看兩件事：<b>①「行き」= 終點站</b>（決定方向）<b>② 車種</b>：普通（每站停）＜準急＜急行＜快速急行＜特急（停最少站）。Google Maps 會寫要搭哪一種、幾號月台。</li>
  <li class="shu-t"><b>近鐵「特急」要另外買特急券</b>，1/12 去奈良搭「快速急行」或「急行」就好。阪神、阪急、京阪的特急不用加錢。</li>
  <li>餘額不夠出不了站：閘門旁邊的黃色「のりこし精算」機，放卡補錢再出站。</li>
  <li>電扶梯：大阪<b>站右邊</b>、京都<b>站左邊</b>，另一邊讓人走。</li>
  <li>車上不講電話、小聲說話；早上尖峰有「女性專用車廂」，男生不要上。</li>
  <li>坐過頭不用緊張，出站時多扣的錢會自動算。</li></ul>`},
 {t:"錢、刷卡、ATM",b:`<ul class="li">
  <li>大部分店可以刷卡；<b>神社門票、市場小攤、拉麵食券機常常只收現金</b>。</li>
  <li>現金不夠：7-Eleven 的 ATM 可以用台灣的金融卡提款（出發前跟銀行確認有開通「跨國提款」）。</li>
  <li>日本不用給小費。</li>
  <li>刷卡時店員問「一括（いっかつ）でよろしいですか」= 一次付清，回答「はい」。</li></ul>`},
 {t:"退稅（2026/11 新制）",b:`<div class="warn">2026/11/1 起：店裡<b>先付含稅價</b>，出境時在機場給海關確認後，<b>再退錢給你</b>。</div>
  <p style="margin:10px 0 4px"><b>在店裡（藥妝、唐吉訶德、Bic Camera）</b></p>
  <ol class="li">
  <li>同一間店當天買滿 ¥5,000（未稅）才能退。結帳時到<b>指定退稅櫃台</b>，給護照，說「免税でお願いします」。</li>
  <li>現在<b>不會再封進免稅袋</b>，店員給一般塑膠袋；買多的話可以加買大袋子。</li>
  <li><b class="shu">化妝品、零食、藥品出境前不要拆來用</b>，用了就不能退。整張收據裡少一件，整張都不能退。</li>
  <li>店員會給一張<b>有 QR Code 的明細</b>，<b>收好</b>，回程要用來登記退款。</li></ol>
  <p style="margin:10px 0 4px"><b>選退款方式</b></p>
  <ul class="li">
  <li><b>退到信用卡（建議）</b>：掃明細上的 QR Code，到退款公司網站（例如 J Tax Refund）填信用卡。不用當場掃，回飯店或回台灣後再填都可以，期限看明細說明。</li>
  <li><b>機場退現金</b>：手續費比較高；神戶機場有沒有退現金機台，出發前要再確認。</li>
  <li>各店退款公司不同、手續費不同；唐吉訶德、Bic Camera 宣布不收手續費，札幌藥妝用等值折扣補回手續費。</li></ul>
  <p style="margin:10px 0 4px"><b>在機場（1/15 神戶機場第 2 航廈）</b></p>
  <ol class="li">
  <li><b class="shu">一定要在報到託運行李之前辦</b>：到出發大廳的「免稅手續機台（キオスク）」掃護照。</li>
  <li>畫面顯示<b>綠色</b> = 完成，可以去報到；顯示<b>紅色</b> = 到海關檢查處，把退稅品拿出來給他們看。</li>
  <li>所以<b>退稅品集中放一個袋子</b>，紅色時才拿得出來。</li>
  <li>完成後，退款公司才會把稅金退到你登記的信用卡。</li></ol>
  <p class="small">購買日起 90 天內出境才能退。我們買的東西 1/15 就出境，沒問題。</p>`},
 {t:"吃飯",b:`<ul class="li">
  <li>拉麵、丼飯店門口常有<b>食券機</b>：先投錢買票，把票交給店員。</li>
  <li>熱門店要排隊，排在最後面，不要插隊。</li>
  <li>坐下後店員會給免費的水或茶。</li>
  <li>結帳在門口櫃台，不是在座位上。</li>
  <li>便利商店買便當可以請店員微波（「温めてください」）。</li>
  <li>垃圾桶很少，身上帶一個塑膠袋裝垃圾。</li></ul>`},
 {t:"禮儀",b:`<ul class="li">
  <li>路上禁菸，只能在吸菸區抽。</li>
  <li>神社參拜：鳥居前鞠躬 → 手水舍洗手 → 投香油錢 → <b>二拜、二拍手、一拜</b>。</li>
  <li>寺廟、神社有些地方禁止拍照，看告示。</li>
  <li>錦市場、部分商店街禁止邊走邊吃；在店門口吃完再走。</li>
  <li>飯店、民宿房間不能在床上吃東西弄髒；泡澡規矩看飯店說明。</li></ul>`},
 {t:"緊急狀況",b:`<ul class="li">
  <li>警察 <b>110</b>、救護車／消防 <b>119</b>。</li>
  <li>JNTO 訪日外國人熱線（24 小時，有中文）：<b>050-3816-2787</b>。</li>
  <li>東西掉了：去最近的派出所（交番）或車站服務處，說「忘れ物（わすれもの）」。</li>
  <li>地震：手機會跳警報。躲桌子下、遠離窗戶，聽廣播；飯店門後有避難路線圖。</li>
  <li>護照遺失：先報警拿遺失證明，再聯絡台北駐大阪經濟文化辦事處（出發前把電話存好）。</li></ul>`},
 {t:"回程：神戶機場出境",b:`<ol class="li">
  <li>起飛前 <b>2 小時</b>到第 2 航廈（13:15 起飛 → 11:15 前到）。</li>
  <li><b class="shu">有退稅品 → 先到免稅手續機台掃護照（一定要在託運之前）</b>，紅色才需要給海關看東西。</li>
  <li>星宇櫃台報到、託運。</li>
  <li>安檢、出境審查。</li>
  <li><b class="shu">日本的肉製品不能帶回台灣</b>（包括真空包裝、含肉泡麵），被查到罰很重。</li></ol>`}
];

 const start=i===0?null:(i>=5?HOTEL_KOBE:HOTEL_OSAKA), end=i===DAYS.length-1?null:(i>=4?HOTEL_KOBE:HOTEL_OSAKA);
 if(start)add(start,LABEL[start]); d.stops.forEach(s=>{if(!s.q)return;const h=LABEL[s.q];if(s.mv&&!h)return;add(s.q,h||s.n);}); if(end)add(end,LABEL[end]); return pts;}
function routeUrls(p){const o=[];for(let k=0;k<p.length-1;k+=9)o.push("https://www.google.com/maps/dir/"+p.slice(k,k+10).map(x=>encodeURIComponent(x.q)).join("/"));return o;}

function seigaiha(y0,rows,w,col){let s="";const r=18;for(let row=0;row<rows;row++){const y=y0+row*9,off=row%2?r:0;for(let x=-r+off;x<w+r;x+=r*2){
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="#f3ede1" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="${r*.68}" fill="none" stroke="#f3ede1" stroke-width="1.3"/><circle cx="${x}" cy="${y}" r="${r*.36}" fill="none" stroke="#f3ede1" stroke-width="1.2"/>`;}}return s;}
function flakes(n,seed,h){let s=seed,o="";const r=()=>{s=(s*9301+49297)%233280;return s/233280;};for(let i=0;i<n;i++){o+=`<circle class="flake" cx="${(r()*400).toFixed(0)}" cy="0" r="${(1+r()*1.5).toFixed(1)}" fill="#fff" stroke="#c9cfd8" stroke-width=".4" style="animation-duration:${(8+r()*8).toFixed(1)}s;animation-delay:${(-r()*14).toFixed(1)}s"/>`;}return o;}

const NAV=[["home","首頁"],["plan","行程"],["guide","攻略"],["food","美食"],["tool","工具"]];

let lastDay=store.get("kj-lastday","day-1"), timer=null;
function renderNav(cur){const n=document.getElementById("nav");
 n.innerHTML=NAV.map(([k,l])=>`<button class="nb" type="button" data-k="${k}" aria-current="${cur===k?"page":"false"}">${ICON[k]}${l}</button>`).join("");
 n.querySelectorAll(".nb").forEach(b=>b.onclick=()=>{const k=b.dataset.k;location.hash=k==="plan"?lastDay:k==="tool"?(store.get("kj-tool","stay")):k;});}
function todayIdx(){const n=new Date();return(n.getFullYear()===2027&&n.getMonth()===0&&n.getDate()>=9&&n.getDate()<=15)?n.getDate()-9:-1;}
function route(){
 if(timer){clearInterval(timer);timer=null;}
 let h=location.hash.replace("#","");
 if(!h){const t=todayIdx();h=t>=0?DAYS[t].id:"home";}
 const v=document.getElementById("view");
 const di=DAYS.findIndex(d=>d.id===h);
 if(di>=0){lastDay=h;store.set("kj-lastday",h);renderNav("plan");v.innerHTML=dayView(di);bindDay();window.scrollTo(0,0);return;}
 if(TOOLS.some(t=>t[0]===h)){store.set("kj-tool",h);renderNav("tool");
   const f={stay:stayView,budget:budgetView,list:listView,weather:weatherView,nearby:nearbyView}[h];
   v.innerHTML=toolNav(h)+f();window.scrollTo(0,0);
   if(h==="budget")bindBudget(); if(h==="list")bindList(); if(h==="weather")loadWeather(false); if(h==="nearby")bindNearby(); return;}
 if(h==="guide"){renderNav("guide");v.innerHTML=guideView();window.scrollTo(0,0);bindGuide();return;}
 if(h==="food"){renderNav("food");v.innerHTML=foodView();window.scrollTo(0,0);return;}
 renderNav("home");v.innerHTML=homeView();window.scrollTo(0,0);startCount();
}
function toolNav(cur){return `<div class="sub">${TOOLS.map(([k,l])=>`<a href="#${k}" aria-current="${k===cur?"page":"false"}">${l}</a>`).join("")}</div>`;}

 el.innerHTML=`<span class="lb">出発まで</span><span class="u"><b>${d}</b><span>天</span></span><span class="u"><b>${hh}</b><span>時</span></span><span class="u"><b>${mm}</b><span>分</span></span>`;};tick();timer=setInterval(tick,20000);}

function listView(){const L=getList();return `<h1 class="ttl">清單</h1><p class="lead">打勾、刪除、新增都存在這支手機。</p>`+
 L.map((g,gi)=>`<div class="card"><h3>${esc(g.c)}</h3>${g.items.map((it,ii)=>`<div class="ck${it.on?" on":""}"><input type="checkbox" id="c${gi}_${ii}" data-g="${gi}" data-i="${ii}" ${it.on?"checked":""}><label for="c${gi}_${ii}">${esc(it.t)}</label><button class="del" type="button" data-g="${gi}" data-i="${ii}">刪</button></div>`).join("")}
 <div class="addrow"><input placeholder="新增項目" data-add="${gi}"><button type="button" data-addbtn="${gi}">加</button></div></div>`).join("")+`<p class="foot"><button class="del" type="button" id="reset">恢復預設清單</button></p>`;}
function bindList(){const save=L=>{store.set("kj-list2",L);route();};
 document.querySelectorAll('.ck input[type=checkbox]').forEach(c=>c.onchange=()=>{const L=getList();L[c.dataset.g].items[c.dataset.i].on=c.checked;store.set("kj-list2",L);c.closest(".ck").classList.toggle("on",c.checked);});
 document.querySelectorAll('.ck .del').forEach(b=>b.onclick=()=>{const L=getList();L[b.dataset.g].items.splice(b.dataset.i,1);save(L);});
 document.querySelectorAll('[data-addbtn]').forEach(b=>b.onclick=()=>{const g=b.dataset.addbtn,inp=document.querySelector(`[data-add="${g}"]`),t=inp.value.trim();if(!t)return;const L=getList();L[g].items.push({t,on:false});save(L);});
 document.querySelectorAll('[data-add]').forEach(inp=>inp.onkeydown=e=>{if(e.key==="Enter")document.querySelector(`[data-addbtn="${inp.dataset.add}"]`).click();});
 document.getElementById("reset").onclick=()=>{try{localStorage.removeItem("kj-list2");}catch(e){}route();};}

const WMO=c=>c===0?"晴":c<=2?"晴時多雲":c===3?"陰":c<=48?"霧":c<=57?"毛毛雨":c<=67?"雨":c<=77?"雪":c<=82?"陣雨":c<=86?"陣雪":"雷雨";
function weatherView(){return `<h1 class="ttl">天氣</h1><p class="lead">資料來自 Open-Meteo，約可預報 16 天內；太遠的日期顯示「尚無預報」。1 月關西氣溫約 3–9℃，晚上很冷。</p>
 <div style="margin:0 18px"><button class="btn" type="button" id="wre">重新整理</button> <span class="small" id="wst"></span></div>
 <div id="wbox">${CITIES.map(c=>`<div class="card"><h3>${c.n} <span class="small">${c.days}</span></h3><p class="small" style="margin:0">載入中…</p></div>`).join("")}</div>
 <h2 class="sec">官方預報</h2><div class="card">${CITIES.map(c=>`<div style="padding:4px 0">${c.n}：<a href="https://www.jma.go.jp/bosai/forecast/#area_type=offices&area_code=${c.jma}" target="_blank" rel="noopener">日本氣象廳</a>・<a href="https://www.windy.com/${c.lat}/${c.lon}?${c.lat},${c.lon},10" target="_blank" rel="noopener">Windy</a></div>`).join("")}</div>`;}
function drawWeather(data,ts,stale){const box=document.getElementById("wbox");if(!box)return;
 box.innerHTML=CITIES.map((c,k)=>{const w=data[k];if(!w)return `<div class="card"><h3>${c.n}</h3><p class="small" style="margin:0">讀取失敗</p></div>`;const cur=w.current,D=w.daily;
  const rows=TRIP_DATES.map(dt=>{const j=D.time.indexOf(dt),lb=dt.slice(5).replace("-","/");if(j<0)return `<div class="wrow"><span class="dt">${lb}</span><span class="muted" style="grid-column:span 2">尚無預報</span></div>`;
   return `<div class="wrow"><span class="dt">${lb}</span><span>${WMO(D.weather_code[j])}</span><span>${Math.round(D.temperature_2m_min[j])}～${Math.round(D.temperature_2m_max[j])}℃・降水 ${D.precipitation_probability_max[j]??"–"}%</span></div>`;}).join("");
  return `<div class="card"><h3>${c.n} <span class="small">${c.days}</span></h3><div style="margin-bottom:4px">現在 ${WMO(cur.weather_code)}・${Math.round(cur.temperature_2m)}℃・風 ${Math.round(cur.wind_speed_10m)} km/h</div>${rows}</div>`;}).join("");
 const st=document.getElementById("wst");if(st){const t=new Date(ts);st.textContent=`${stale?"離線，上次資料・":""}更新 ${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`;}}
function loadWeather(force){const b=document.getElementById("wre");if(b)b.onclick=()=>loadWeather(true);const cache=store.get("kj-weather",null);
 if(cache&&!force&&Date.now()-cache.ts<30*60*1000){drawWeather(cache.data,cache.ts,false);return;}
 const url=c=>`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16`;
 Promise.all(CITIES.map(c=>fetch(url(c)).then(r=>{if(!r.ok)throw 0;return r.json();}))).then(data=>{const ts=Date.now();store.set("kj-weather",{ts,data});drawWeather(data,ts,false);})
 .catch(()=>{if(cache)drawWeather(cache.data,cache.ts,true);else{const box=document.getElementById("wbox");if(box)box.innerHTML=`<div class="card"><p style="margin:0">讀不到即時天氣（沒網路，或在不允許連線的預覽頁）。用下面的官方預報查。</p></div>`;}});}

let pos=null;
function nearUrl(t){return pos?`https://www.google.com/maps/search/${encodeURIComponent(t)}/@${pos.lat},${pos.lon},16z`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t)}`;}
function nearbyView(){return `<h1 class="ttl">找附近</h1><p class="lead">按類別直接在 Google Maps 搜附近（用日文搜，結果比較多）。</p>
 <div style="margin:0 18px"><button class="btn" type="button" id="geo">用目前位置</button> <span class="small" id="gst">${pos?"已定位":"沒定位也可以按，Google Maps 會自己抓位置"}</span></div>
 <div class="near" id="near">${NEARBY.map(([z,j])=>`<a href="${nearUrl(j)}" target="_blank" rel="noopener" data-ja="${j}">${z}<small>${j}</small></a>`).join("")}</div>`;}
function bindNearby(){document.getElementById("geo").onclick=()=>{const st=document.getElementById("gst");if(!navigator.geolocation){st.textContent="這裡無法定位，直接按類別";return;}st.textContent="定位中…";
 navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude.toFixed(5),lon:p.coords.longitude.toFixed(5)};st.textContent="已定位";document.querySelectorAll("#near a").forEach(a=>a.href=nearUrl(a.dataset.ja));},()=>{st.textContent="無法定位，直接按類別";},{enableHighAccuracy:true,timeout:10000});};}

/* ================= boot ================= */
if(window.__kjRoute)window.removeEventListener("hashchange",window.__kjRoute);
window.__kjRoute=route;window.addEventListener("hashchange",route);route();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
})();
</script>
</body>
</html>
